services:
  postgres:
    image: postgis/postgis@sha256:3f4a5d48e0be9580ed70ed618cd039ce57bbb2dd113053d3836e28513f1f87cd
    environment:
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ${REHEARSAL_POSTGRES_PASSWORD:?set REHEARSAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ontology
    volumes:
      - rehearsal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: rehearsal-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${REHEARSAL_KEYCLOAK_ADMIN_PASSWORD:?set REHEARSAL_KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://idp.localhost:18080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak-realm.json:/opt/keycloak/data/import/ontology-realm.json:ro
      - ./deploy/keycloak-user-profile.json:/opt/keycloak/conf/ontology-user-profile.json:ro
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  oms-api:
    build:
      context: .
      dockerfile: oms/Dockerfile
    environment:
      APP_ENV: production
      AUTH_MODE: oidc
      DATABASE_URL: postgresql+psycopg2://ontology:${REHEARSAL_POSTGRES_PASSWORD}@postgres:5432/ontology
      OIDC_ISSUER: http://idp.localhost:18080/realms/ontology
      OIDC_CLIENT_ID: ontology-platform
      OIDC_REDIRECT_URI: http://localhost:18000/auth/callback
      SESSION_TTL_SECONDS: "3600"
      FORWARDED_ALLOW_IPS: "*"
      CONNECTOR_SECRET_KEY: ${REHEARSAL_CONNECTOR_SECRET_KEY:?set REHEARSAL_CONNECTOR_SECRET_KEY}
      CONNECTOR_SECRET_KEY_ID: rehearsal-v1
      CONNECTOR_ALLOW_PRIVATE_NETWORKS: "false"
    extra_hosts:
      - "idp.localhost:host-gateway"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  oms-api-peer:
    build:
      context: .
      dockerfile: oms/Dockerfile
    environment:
      APP_ENV: production
      AUTH_MODE: oidc
      DATABASE_URL: postgresql+psycopg2://ontology:${REHEARSAL_POSTGRES_PASSWORD}@postgres:5432/ontology
      OIDC_ISSUER: http://idp.localhost:18080/realms/ontology
      OIDC_CLIENT_ID: ontology-platform
      OIDC_REDIRECT_URI: http://localhost:18000/auth/callback
      SESSION_TTL_SECONDS: "3600"
      FORWARDED_ALLOW_IPS: "*"
      CONNECTOR_SECRET_KEY: ${REHEARSAL_CONNECTOR_SECRET_KEY:?set REHEARSAL_CONNECTOR_SECRET_KEY}
      CONNECTOR_SECRET_KEY_ID: rehearsal-v1
      CONNECTOR_ALLOW_PRIVATE_NETWORKS: "false"
    extra_hosts:
      - "idp.localhost:host-gateway"
    ports:
      - "127.0.0.1:18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  rehearsal_pgdata:
