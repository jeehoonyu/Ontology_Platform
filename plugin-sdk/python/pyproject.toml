[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologyos-plugin-sdk"
version = "1.0.0"
description = "Dependency-free typed contracts for OntologyOS sandbox plugins"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]
