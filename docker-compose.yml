services:
  oms-api:
    build:
      context: .
      dockerfile: oms/Dockerfile
    container_name: ontology_oms_api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ontology_ops}
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DATA_SNAPSHOT_BACKEND: ${DATA_SNAPSHOT_BACKEND:-local}
      DATA_SNAPSHOT_ROOT: ${DATA_SNAPSHOT_ROOT:-/var/lib/ontology/snapshots}
      DATA_SNAPSHOT_BUCKET: ${DATA_SNAPSHOT_BUCKET:-}
      DATA_SNAPSHOT_S3_ENDPOINT: ${DATA_SNAPSHOT_S3_ENDPOINT:-}
      DATA_SNAPSHOT_S3_REGION: ${DATA_SNAPSHOT_S3_REGION:-us-east-1}
      DATA_SNAPSHOT_S3_ADDRESSING_STYLE: ${DATA_SNAPSHOT_S3_ADDRESSING_STYLE:-path}
      DATA_SNAPSHOT_S3_AUTO_CREATE_BUCKET: ${DATA_SNAPSHOT_S3_AUTO_CREATE_BUCKET:-false}
      DATA_SNAPSHOT_CACHE_ROOT: ${DATA_SNAPSHOT_CACHE_ROOT:-/var/cache/ontology/snapshots}
      DATA_SNAPSHOT_CACHE_MAX_BYTES: ${DATA_SNAPSHOT_CACHE_MAX_BYTES:-21474836480}
      DATA_SNAPSHOT_CACHE_LEASE_SECONDS: ${DATA_SNAPSHOT_CACHE_LEASE_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MODEL_GATEWAY_ALLOWED_HOSTS: ${MODEL_GATEWAY_ALLOWED_HOSTS:-}
      MODEL_GATEWAY_ALLOW_PRIVATE_NETWORKS: ${MODEL_GATEWAY_ALLOW_PRIVATE_NETWORKS:-false}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ontology_snapshots:/var/lib/ontology/snapshots
      - ontology_snapshot_cache:/var/cache/ontology/snapshots
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgis/postgis@sha256:3f4a5d48e0be9580ed70ed618cd039ce57bbb2dd113053d3836e28513f1f87cd
    container_name: ontology_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ontology_ops}
    ports:
      - "5432:5432"
    volumes:
      # A named volume, not a bind mount. On Docker Desktop a bind mount puts
      # the data directory across the Windows filesystem boundary, and at
      # reference scale that layer fails rather than merely slowing down: a
      # 50-million-row insert produced "could not write to log file ... Input/
      # output error", the WAL writer aborted, and the container died with
      # pg_control unreadable. A named volume lives on the VM's own filesystem.
      # docker-compose.rehearsal.yml already does this.
      - ontology_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: ["postgres", "-c", "wal_level=logical"] 
    # Logical WAL needed for Debezium CDC

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ontology_clickhouse
    profiles: ["cdc"]
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./chdata:/var/lib/clickhouse
    depends_on:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper@sha256:3ace7c3475a58afa128d0ee05bb9a06474b99b48c9d536c33144133637786f7f
    container_name: ontology_zookeeper
    profiles: ["cdc"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka@sha256:06e5d17d6c5163f3084ffb3c0a5f7f87ba87f35cc4739b598500b3db45dce35b
    container_name: ontology_kafka
    profiles: ["cdc"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  debezium:
    image: debezium/connect:2.4
    container_name: ontology_debezium
    profiles: ["cdc"]
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses

  mock-rest-source:
    image: python:3.12-slim
    container_name: ontology_mock_rest_source
    profiles: ["connectors"]
    ports:
      - "9100:9100"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        RECORDS = [
          {"asset_id": "asset_mock_1", "name": "Mock Pump", "status": "DEGRADED", "criticality": "high", "vibration_mm_s": 9.8, "temperature_c": 91.0},
          {"asset_id": "asset_mock_2", "name": "Mock Chiller", "status": "RUNNING", "criticality": "medium", "vibration_mm_s": 3.2, "temperature_c": 70.1}
        ]

        class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
            body = json.dumps({"records": RECORDS}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        HTTPServer(("0.0.0.0", 9100), Handler).serve_forever()

  sftp-source:
    image: atmoz/sftp@sha256:a6cb3eb29202ca7f57e73bb7e527286e66e0e822fff65609207c7e0ef2d135a3
    container_name: ontology_sftp_source
    profiles: ["connectors"]
    command: ["demo:demo:1001::upload"]
    ports:
      - "2222:22"
    volumes:
      - ./deploy/fixtures/sftp:/home/demo/upload:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["object-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ontology}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ontology-development-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ontology_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ontology_pgdata:
  ontology_snapshots:
  ontology_snapshot_cache:
  ontology_plugin_bundles:
  ontology_minio:
