services:
  oms-api:
    build:
      context: ./oms
      dockerfile: Dockerfile
    container_name: ontology_oms_api
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:password@postgres:5432/ontology_ops
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgis/postgis:15-3.4
    container_name: ontology_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ontology_ops
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: ["postgres", "-c", "wal_level=logical"] 
    # Logical WAL needed for Debezium CDC

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ontology_clickhouse
    profiles: ["cdc"]
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./chdata:/var/lib/clickhouse
    depends_on:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ontology_zookeeper
    profiles: ["cdc"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ontology_kafka
    profiles: ["cdc"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  debezium:
    image: debezium/connect:2.4
    container_name: ontology_debezium
    profiles: ["cdc"]
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses

  mock-rest-source:
    image: python:3.12-slim
    container_name: ontology_mock_rest_source
    profiles: ["connectors"]
    ports:
      - "9100:9100"
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        RECORDS = [
          {"asset_id": "asset_mock_1", "name": "Mock Pump", "status": "DEGRADED", "criticality": "high", "vibration_mm_s": 9.8, "temperature_c": 91.0},
          {"asset_id": "asset_mock_2", "name": "Mock Chiller", "status": "RUNNING", "criticality": "medium", "vibration_mm_s": 3.2, "temperature_c": 70.1}
        ]

        class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
            body = json.dumps({"records": RECORDS}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        HTTPServer(("0.0.0.0", 9100), Handler).serve_forever()
